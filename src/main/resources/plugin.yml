name: Duels
version: 1.0
main: dev.duels.DuelsPlugin
api-version: 1.21
description: A complete duels plugin with queues, kits and arenas
author: Ryhox
softdepend: [PlaceholderAPI, TAB]

commands:
  duels:
    description: Main command
    usage: /<command>
    aliases: [duelplugin]

  duel:
    description: Challenge a player to a duel
    usage: /<command> <player>

  queue:
    description: Queue commands
    usage: /<command> <join|leave|gui> [kit]
    aliases: [q]

  kits:
    description: View available kits
    usage: /<command>

  previewkit:
    description: Preview a kit in your inventory
    usage: /<command> <kitname>

  stats:
    description: Check your or another player's stats
    usage: /<command> [player]

  settings:
    description: Open settings menu
    usage: /<command>

  arena:
    description: Create and manage arenas
    usage: /<command> <subcommand> [arenaName]

  setspawn:
    description: Set spawn location
    usage: /<command>

  setkills:
    description: Set player kills
    usage: /<command> <player> <amount>

  setdeaths:
    description: Set player deaths
    usage: /<command> <player> <amount>

  setwins:
    description: Set player wins
    usage: /<command> <player> <amount>

  setlosses:
    description: Set player losses
    usage: /<command> <player|all> <amount>

  setcoins:
    description: Set player coins
    usage: /<command> <player|all> <amount>

  killsadd:
    description: Add to player kills
    usage: /<command> <player|all> <amount>
    aliases: ["addkills"]

  deathsadd:
    description: Add to player deaths
    usage: /<command> <player|all> <amount>
    aliases: ["adddeaths"]

  winsadd:
    description: Add to player wins
    usage: /<command> <player|all> <amount>
    aliases: ["addwins"]

  lossesadd:
    description: Add to player losses
    usage: /<command> <player|all> <amount>
    aliases: ["addlosses"]

  coinsadd:
    description: Add to player coins
    usage: /<command> <player|all> <amount>
    aliases: ["addcoins"]

  kit:
    description: Manage duel kits
    usage: /kit <add|remove> ...

  ping:
    description: Check ping
    usage: /<command> [player]

  fly:
    description: Toggle flight in lobby
    usage: /<command>

  spawn:
    description: Teleport to spawn
    usage: /<command>

  accept:
    description: Accept a duel request
    usage: /<command>

  party:
    description: Manage your party (create, invite, kick, public, etc.)
    usage: /<command> <create|invite|accept|deny|leave|kick|disband|public|join|list|info|menu>
    aliases: [p]

  spectate:
    description: Spectate a duel or FFA
    usage: /<command> <player|stop>
    aliases: [spec, watch]

  dkit:
    description: Open kit edit GUI directly (admin)
    usage: /<command> edit <kitName>
    aliases: ["duels:kit"]

  customkit:
    description: Manage your custom kits (open list, copy another player's kit)
    usage: /<command> [copy <owner>]
    aliases: [customkits, ckit]

permissions:
  duels.*:
    description: Gives access to all duels commands
    children:
      duels.admin: true
      duels.fly: true
      duels.reload: true
      duels.setspawn: true
      duels.party.size.30: true
      duels.party.public: true

  duels.admin:
    description: Admin permissions
    default: op

  duels.fly:
    description: Allow flying in lobby
    default: op

  duels.reload:
    description: Reload plugin config
    default: op

  duels.setspawn:
    description: Set spawn location
    default: op

  duels.party.size.15:
    description: Default party size limit (15 members)
    default: true

  duels.party.size.20:
    description: Allows party size up to 20 members
    default: false

  duels.party.size.30:
    description: Allows party size up to 30 members
    default: false

  duels.party.public:
    description: Allows opening a public party announced in chat
    default: false

  duels.armortrim:
    description: Allows editing personal armor trims via /duels armortrim
    default: false

  duels.customkit.tier0:
    description: Allows creating 1 custom kit (party only)
    default: false

  duels.customkit.tier1:
    description: Allows creating up to 2 custom kits (party only)
    default: false

  duels.customkit.tier2:
    description: Allows creating up to 4 custom kits (party only)
    default: false